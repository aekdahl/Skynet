name: Landing page

# Deploys the static landing page (landing/) to GitHub Pages. The page lets users
# download the desktop app (from the latest GitHub Release's assets) and fetch the
# headless MCP server image (ghcr.io/<owner>/skynet-mcp).
#
# One-time setup: repo Settings → Pages → Build and deployment → Source = "GitHub
# Actions". Then every push to main that touches landing/ redeploys it.
on:
  push:
    branches: [main]
    paths: ["landing/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload landing/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
