name: MCP image

# Builds the headless MCP server image (skynet/Dockerfile.mcp) and publishes it
# to GitHub Container Registry (ghcr.io/<owner>/skynet-mcp).
#
# Triggers:
#   • workflow_dispatch — build a new image ON DEMAND from the Actions tab.
#     Optional `tag` input adds a human tag (default "latest") alongside the SHA.
#   • push of a v* tag — a release cuts an image tagged with the version.
#
# The monorepo lives under skynet/, so the Docker build context is ./skynet and
# the Dockerfile is skynet/Dockerfile.mcp.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to publish (alongside the commit SHA)"
        default: latest
        required: false
  push:
    tags: ["v*"]

concurrency:
  group: mcp-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/skynet-mcp
          # sha on every build; the manual `tag` input on dispatch; the git tag on release.
          tags: |
            type=sha,format=long
            type=raw,value=${{ github.event.inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./skynet
          file: ./skynet/Dockerfile.mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published skynet-mcp image :ship:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Use in docs/mcp-sandbox.md as the sandbox image." >> "$GITHUB_STEP_SUMMARY"
