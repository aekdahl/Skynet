<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"></meta>
<meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
<title>Tower — Overview Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"></link>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"></link>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></link>
<style>
:root {
  --bg: #0B0D11; --panel: #11141A; --raised: #171B23;
  --line: #232936; --line-soft: #1B202B;
  --text: #E9ECF2; --muted: #8B93A5; --faint: #596172;
  --accent: #FFB224; --ok: #3DD68C; --warn: #FFB224; --danger: #FF5D5D;
  --info: #5EA2FF; --violet: #A78BFA;
  --font-ui: 'Space Grotesk', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}
.mono { font-family: var(--font-mono); font-size: 0.92em; }

/* ===== board shell ===== */
.ex-board {
  width: 100%; height: 100%; box-sizing: border-box; overflow: hidden;
  background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px;
  padding: 34px 38px; display: flex; flex-direction: column; gap: 26px; text-align: left;
}
.ex-board * { box-sizing: border-box; }
.exhead { display: flex; justify-content: space-between; align-items: flex-start; }
.exhead h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.015em; }
.exhead p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.exbrand { font-size: 12px; font-weight: 700; letter-spacing: 0.22em; color: var(--faint); }
.ex-sec-head { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: var(--faint); }
.ex-conflict { color: var(--danger); font-size: 12px; }

.exdot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.exdot-active { background: var(--ok); box-shadow: 0 0 8px color-mix(in oklch, var(--ok), transparent 40%); }
.exdot-blocked { background: var(--warn); box-shadow: 0 0 8px color-mix(in oklch, var(--warn), transparent 40%); }
.exdot-review { background: var(--info); }
.exdot-idle { background: transparent; border: 1.5px solid var(--faint); width: 7px; height: 7px; }
.exdot-done { background: var(--faint); }

.exbar { height: 4px; border-radius: 2px; background: var(--line-soft); overflow: hidden; width: 110px; flex: none; }
.exbar-f { height: 100%; border-radius: 2px; }
.exbar-active { background: var(--ok); } .exbar-blocked { background: var(--warn); }
.exbar-review { background: var(--info); } .exbar-done { background: var(--faint); }

.expill {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; border-radius: 20px;
  padding: 3px 10px; white-space: nowrap; border: 1px solid;
}
.expill-blocked { color: var(--warn); border-color: color-mix(in oklch, var(--warn), transparent 70%); background: color-mix(in oklch, var(--warn), transparent 93%); }
.expill-conflict { color: var(--danger); border-color: color-mix(in oklch, var(--danger), transparent 70%); background: color-mix(in oklch, var(--danger), transparent 93%); }
.expill-done { color: var(--faint); border-color: var(--line); background: none; }

/* agent strip */
.ex-pool { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 18px; }
.ex-pool-label { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: var(--faint); margin-right: 6px; }
.ex-chip {
  display: inline-flex; align-items: center; gap: 8px; font-size: 11px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 5px 12px;
}
.ex-chip-idle { border-style: dashed; color: var(--faint); }
.ex-chip-sub { color: var(--muted); max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex-chip-idle .ex-chip-sub { color: var(--faint); }

/* ===== option 1: ledger ===== */
.lg-table { display: flex; flex-direction: column; gap: 18px; }
.lg-group { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.lg-group-head { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.14em; padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
.lg-gh-blocked { color: var(--warn); } .lg-gh-review { color: var(--info); } .lg-gh-active { color: var(--ok); }
.lg-row {
  display: grid; grid-template-columns: 10px 1.5fr 0.9fr 1.5fr 110px 90px;
  gap: 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line-soft);
}
.lg-row:last-child { border-bottom: none; }
.lg-task { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg-proj { font-family: var(--font-mono); font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg-step { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg-state { font-family: var(--font-mono); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
.lg-state-blocked { color: var(--warn); } .lg-state-review { color: var(--info); } .lg-state-active { color: var(--muted); }

/* ===== option 2: subway ===== */
.sw-list { display: flex; flex-direction: column; gap: 14px; }
.sw-proj { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px 8px; }
.sw-proj-done { opacity: 0.5; }
.sw-proj-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.sw-proj-name { font-size: 15px; font-weight: 600; flex: 1; }
.sw-task { display: grid; grid-template-columns: 230px 1fr 44px; gap: 20px; align-items: center; padding: 10px 0 30px; }
.sw-task-name { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw-track { display: flex; align-items: center; }
.sw-station { position: relative; width: 12px; height: 12px; border-radius: 50%; flex: none; }
.sw-done { background: var(--ok); }
.sw-todo { background: none; border: 2px solid var(--line); width: 10px; height: 10px; }
.sw-cur { background: var(--bg); }
.sw-cur-blocked { border: 3px solid var(--warn); box-shadow: 0 0 12px color-mix(in oklch, var(--warn), transparent 40%); }
.sw-cur-active { border: 3px solid var(--ok); box-shadow: 0 0 12px color-mix(in oklch, var(--ok), transparent 40%); }
.sw-cur-review { border: 3px solid var(--info); box-shadow: 0 0 12px color-mix(in oklch, var(--info), transparent 40%); }
.sw-seg { flex: 1; height: 2px; background: var(--line); }
.sw-seg-done { background: var(--ok); }
.sw-label {
  position: absolute; top: 19px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 10px; white-space: nowrap;
}
.sw-label-blocked { color: var(--warn); } .sw-label-active { color: var(--ok); }
.sw-label-review { color: var(--info); } .sw-label-done { color: var(--faint); }
.sw-count { font-size: 11px; color: var(--faint); text-align: right; }

/* ===== option 3: roster split ===== */
.rs-cols { display: grid; grid-template-columns: 360px 1fr; gap: 26px; align-items: start; }
.rs-cards { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.rs-card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 11px 14px; display: flex; flex-direction: column; gap: 6px; }
.rs-card-idle { border-style: dashed; background: none; }
.rs-card-top { display: flex; align-items: center; gap: 9px; }
.rs-id { font-size: 12px; font-weight: 600; }
.rs-model { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
.rs-task { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rs-idle-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); }
.rs-assign { color: var(--accent); font-weight: 500; }
.rs-tasks { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
.rs-proj { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
.rs-proj-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.rs-task-row { display: grid; grid-template-columns: 10px 1fr 110px 86px; gap: 14px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line-soft); }
.rs-task-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rs-task-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rs-task-step { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===== option 4: control tower ===== */
.ct-cols { display: grid; grid-template-columns: 7fr 5fr; gap: 28px; align-items: start; }
.ct-cards { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.ct-card {
  display: grid; grid-template-columns: 104px 1fr; gap: 20px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px;
}
.ct-card-hot { border-color: color-mix(in oklch, var(--warn), transparent 55%); }
.ct-timer { font-family: var(--font-mono); font-size: 30px; font-weight: 600; color: var(--warn); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.ct-timer small { display: block; font-size: 9px; letter-spacing: 0.16em; color: var(--faint); margin-top: 5px; font-weight: 500; }
.ct-main { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.ct-head-row { display: flex; align-items: center; gap: 12px; }
.ct-chip { font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; border: 1px solid; border-radius: 4px; padding: 2px 7px; }
.ct-meta { font-family: var(--font-mono); font-size: 10px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct-title { font-size: 15px; font-weight: 600; }
.ct-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.ct-btn { font-size: 12px; font-weight: 500; padding: 6px 13px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); color: var(--text); }
.ct-btn-p { background: var(--accent); color: #0B0D11; border-color: var(--accent); font-weight: 600; }
.ct-right { display: flex; flex-direction: column; gap: 26px; margin-top: 0; }
.ct-cap { display: flex; gap: 4px; height: 40px; margin-top: 12px; }
.ct-seg { flex: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
.ct-seg-active { background: color-mix(in oklch, var(--ok), transparent 82%); color: var(--ok); }
.ct-seg-blocked { background: color-mix(in oklch, var(--warn), transparent 82%); color: var(--warn); }
.ct-seg-review { background: color-mix(in oklch, var(--info), transparent 82%); color: var(--info); }
.ct-seg-idle { background: none; border: 1px dashed var(--line); color: var(--faint); }
.ct-cap-note { font-size: 11px; color: var(--muted); margin: 9px 0 0; line-height: 1.5; }
.ct-run { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 2px 16px; margin-top: 12px; }
.ct-run-row { display: grid; grid-template-columns: 10px 1fr 92px 36px; gap: 13px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.ct-run-row:first-child { border-top: none; }
.ct-run-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ct-run-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct-run-step { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct-run-pct { font-size: 11px; color: var(--muted); text-align: right; }
.ct-conflict {
  border: 1px solid color-mix(in oklch, var(--danger), transparent 65%);
  background: color-mix(in oklch, var(--danger), transparent 94%);
  border-radius: 10px; padding: 14px 17px; font-size: 12px; line-height: 1.65; color: var(--text); margin-top: 12px;
}
.ct-conflict b { color: var(--danger); }

/* ===== option 5: timeline ===== */
.tl-wrap { position: relative; }
.tl-axis { position: relative; height: 20px; margin-left: 190px; }
.tl-tick { position: absolute; transform: translateX(-50%); font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
.tl-now-label { position: absolute; transform: translateX(-50%); font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--accent); }
.tl-lanes { position: relative; margin-left: 190px; border-left: 1px solid var(--line); }
.tl-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-soft); }
.tl-now { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--accent); opacity: 0.8; z-index: 2; }
.tl-lane { position: relative; padding: 10px 0; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 8px; }
.tl-proj { position: absolute; left: -190px; top: 50%; transform: translateY(-50%); width: 170px; font-size: 13px; font-weight: 600; text-align: right; padding-right: 16px; color: var(--muted); }
.tl-canvas { position: relative; height: 30px; }
.tl-bar { position: absolute; top: 0; height: 30px; border-radius: 6px; background: var(--raised); border: 1px solid var(--line); overflow: hidden; }
.tl-fill { position: absolute; inset: 0 auto 0 0; opacity: 0.22; }
.tl-bar-active .tl-fill { background: var(--ok); } .tl-bar-active { border-color: color-mix(in oklch, var(--ok), transparent 60%); }
.tl-bar-blocked .tl-fill { background: var(--warn); } .tl-bar-blocked { border-color: color-mix(in oklch, var(--warn), transparent 55%); }
.tl-bar-review .tl-fill { background: var(--info); } .tl-bar-review { border-color: color-mix(in oklch, var(--info), transparent 55%); }
.tl-bar-done .tl-fill { background: var(--faint); } .tl-bar-done { opacity: 0.6; }
.tl-bar-label { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 600; white-space: nowrap; }
.tl-mark { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 12px; color: var(--warn); }
.tl-legend { display: flex; gap: 24px; font-size: 11px; color: var(--muted); }
.tl-legend span { display: inline-flex; align-items: center; gap: 7px; }
</style>
</head>

<div id="root"></div>
