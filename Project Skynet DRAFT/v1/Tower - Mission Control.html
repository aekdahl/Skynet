<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"></meta>
<meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
<title>Tower — Agent Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com"></link>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"></link>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></link>
<style>
:root {
  --bg: #0B0D11;
  --panel: #11141A;
  --raised: #171B23;
  --line: #232936;
  --line-soft: #1B202B;
  --text: #E9ECF2;
  --muted: #8B93A5;
  --faint: #596172;
  --accent: #FFB224;
  --ok: #3DD68C;
  --warn: #FFB224;
  --danger: #FF5D5D;
  --info: #5EA2FF;
  --violet: #A78BFA;
  --font-ui: 'Space Grotesk', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --sp: 16px;
  --card-pad: 20px;
  --fs: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--fs);
  overflow: hidden;
}
#root { height: 100vh; }

.app { height: 100vh; display: flex; flex-direction: column; }
.app[data-density="compact"] { --sp: 10px; --card-pad: 14px; --fs: 13px; }
.app[data-density="comfy"]   { --sp: 22px; --card-pad: 26px; --fs: 15px; }

kbd {
  font-family: var(--font-mono); font-size: 10px; color: var(--muted);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 1px 5px; background: var(--raised);
}
.mono { font-family: var(--font-mono); font-size: 0.92em; }

/* ---------- top bar ---------- */
.topbar {
  height: 50px; flex: none; display: flex; align-items: center; gap: 28px;
  padding: 0 18px; border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-name { font-weight: 700; letter-spacing: 0.22em; font-size: 13px; }
.brand-repo { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
.tabs { display: flex; gap: 4px; }
.tab {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-ui); font-size: 13px; font-weight: 500;
  color: var(--muted); background: none; border: 1px solid transparent;
  border-radius: 6px; padding: 6px 14px; cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); background: var(--raised); border-color: var(--line); }
.tab-badge {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  color: #0B0D11; background: var(--accent); border-radius: 9px; padding: 1px 7px;
}
.topstats { margin-left: auto; display: flex; gap: 18px; font-size: 12px; color: var(--muted); }
.stat { display: flex; align-items: center; gap: 7px; }

/* ---------- status dots ---------- */
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot-running { background: var(--ok); box-shadow: 0 0 8px color-mix(in oklch, var(--ok), transparent 40%); }
.dot-waiting { background: var(--warn); box-shadow: 0 0 8px color-mix(in oklch, var(--warn), transparent 40%); animation: pulse 1.6s ease-in-out infinite; }
.dot-review  { background: var(--info); }
.dot-done    { background: var(--faint); }
@media (prefers-reduced-motion: no-preference) {
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
}

/* ---------- layout ---------- */
.main { flex: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
.content { min-width: 0; overflow-y: auto; position: relative; }
.content::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 80% 50% at 60% -10%, color-mix(in oklch, var(--accent), transparent 96%), transparent);
}

/* ---------- agent rail ---------- */
.rail {
  border-right: 1px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column; min-height: 0;
}
.rail-head {
  flex: none; display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: var(--faint);
}
.rail-count { font-family: var(--font-mono); }
.rail-list { overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 4px; }
.agent-row {
  text-align: left; background: none; border: 1px solid transparent; border-radius: 8px;
  padding: calc(var(--sp) * 0.6) 10px; cursor: pointer; font-family: var(--font-ui);
  display: flex; flex-direction: column; gap: 6px; color: var(--text);
}
.agent-row:hover { background: var(--raised); }
.agent-row.sel { background: var(--raised); border-color: var(--line); }
.agent-row-top { display: flex; align-items: center; gap: 8px; }
.agent-name { font-size: var(--fs); font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conflict-pip { color: var(--danger); font-size: 11px; }
.agent-row-sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wait-tag { color: var(--warn); }
.done-tag { color: var(--faint); }
.step-tag { color: var(--muted); }
.bar { height: 3px; border-radius: 2px; background: var(--line-soft); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
.bar-running { background: var(--ok); }
.bar-waiting { background: var(--warn); }
.bar-review { background: var(--info); }
.bar-done { background: var(--faint); }

/* ---------- queue ---------- */
.queue { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: calc(var(--sp) * 1.6) calc(var(--sp) * 2) 60px; }
.queue-readout {
  display: flex; align-items: flex-end; gap: calc(var(--sp) * 2.4);
  padding: calc(var(--sp) * 1.2) 0 calc(var(--sp) * 1.4);
  border-bottom: 1px solid var(--line); margin-bottom: calc(var(--sp) * 1.4);
}
.readout-block { display: flex; align-items: baseline; gap: 12px; }
.readout-num {
  font-family: var(--font-mono); font-weight: 600; font-size: 44px; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.readout-warn { color: var(--warn); }
.readout-ok { color: var(--ok); }
.readout-label { font-size: 11px; line-height: 1.35; color: var(--faint); letter-spacing: 0.06em; text-transform: uppercase; }
.readout-hint { margin-left: auto; font-size: 11px; color: var(--faint); display: flex; align-items: center; gap: 5px; padding-bottom: 4px; }

.queue-list { display: flex; flex-direction: column; gap: var(--sp); }
.qcard {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: var(--card-pad); display: flex; flex-direction: column; gap: 12px;
  transition: opacity 0.35s ease, transform 0.35s ease, border-color 0.15s ease;
}
.qcard.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 8px 32px rgba(0,0,0,0.35); }
.qcard.leaving { opacity: 0; transform: translateX(32px); }
.qcard-head { display: flex; align-items: center; gap: 12px; }
.kind-chip {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
  border: 1px solid; border-radius: 4px; padding: 2px 7px;
}
.qcard-agent {
  background: none; border: none; cursor: pointer; font-family: var(--font-mono);
  font-size: 11px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line);
}
.qcard-agent:hover { color: var(--text); }
.qcard-wait { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--warn); font-variant-numeric: tabular-nums; }
.qcard-title { font-size: calc(var(--fs) + 4px); font-weight: 600; letter-spacing: -0.01em; }
.qcard-why { font-size: var(--fs); color: var(--muted); line-height: 1.55; text-wrap: pretty; }
.qcard-code {
  font-family: var(--font-mono); font-size: 12px; color: var(--text);
  background: var(--bg); border: 1px solid var(--line-soft); border-radius: 6px;
  padding: 10px 14px; overflow-x: auto;
}
.qcard-steps { padding-left: 20px; display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
.qcard-steps li::marker { font-family: var(--font-mono); color: var(--faint); }
.qcard-diff { display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: 12px; }
.diff-add { color: var(--ok); font-weight: 600; }
.diff-del { color: var(--danger); font-weight: 600; }
.diff-files { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qcard-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-top: 2px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-ui); font-size: 13px; font-weight: 500;
  background: var(--raised); color: var(--text); border: 1px solid var(--line);
  border-radius: 7px; padding: 8px 14px; cursor: pointer; min-height: 36px;
  transition: border-color 0.12s ease, background 0.12s ease;
}
.btn:hover { border-color: var(--faint); }
.btn-primary { background: var(--accent); color: #0B0D11; border-color: var(--accent); font-weight: 600; }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.08); }
.btn-primary kbd { color: #0B0D11; background: rgba(255,255,255,0.25); border-color: transparent; }
.btn-danger { color: var(--danger); }
.btn-danger:hover { border-color: var(--danger); }
.btn-ghost { background: none; color: var(--muted); border-color: transparent; }
.btn-ghost:hover { color: var(--text); border-color: var(--line); }
.rec {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
  background: rgba(0,0,0,0.25); border-radius: 3px; padding: 2px 5px;
}

.queue-empty { text-align: center; padding: 80px 0; color: var(--muted); }
.queue-empty-mark {
  display: inline-flex; width: 56px; height: 56px; border-radius: 50%;
  border: 1px solid var(--ok); color: var(--ok); font-size: 24px;
  align-items: center; justify-content: center; margin-bottom: 16px;
}

/* ---------- agent detail ---------- */
.detail { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: calc(var(--sp) * 1.4) calc(var(--sp) * 2) 60px; display: flex; flex-direction: column; gap: var(--sp); }
.btn-back { align-self: flex-start; margin-left: -10px; }
.detail-head { display: flex; flex-direction: column; gap: 10px; }
.detail-title { display: flex; align-items: center; gap: 12px; }
.detail-title h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.status-word { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; }
.detail-meta { display: flex; gap: 20px; font-size: 12px; color: var(--faint); font-family: var(--font-mono); }
.detail-blocked {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: color-mix(in oklch, var(--warn), transparent 94%);
  border: 1px solid color-mix(in oklch, var(--warn), transparent 70%);
  border-radius: 10px; padding: 14px var(--card-pad);
}
.detail-blocked-title { font-weight: 600; font-size: 14px; }
.detail-conflict {
  font-size: 13px; color: var(--danger); line-height: 1.5;
  background: color-mix(in oklch, var(--danger), transparent 94%);
  border: 1px solid color-mix(in oklch, var(--danger), transparent 75%);
  border-radius: 10px; padding: 12px var(--card-pad);
}
.detail-cols { display: grid; grid-template-columns: 5fr 7fr; gap: var(--sp); align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: var(--card-pad); }
.panel-head { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: var(--faint); display: flex; justify-content: space-between; margin-bottom: 12px; }
.panel-head + .panel-head { margin-top: 20px; }
.panel-sub { font-family: var(--font-mono); }
.plan { list-style: none; display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.plan-step { display: flex; gap: 10px; align-items: baseline; font-size: 13px; padding: 5px 0; color: var(--muted); }
.plan-step.done { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--line); }
.plan-step.now { color: var(--text); font-weight: 600; }
.plan-mark { font-family: var(--font-mono); width: 14px; flex: none; }
.plan-step.done .plan-mark { color: var(--ok); }
.plan-step.now .plan-mark { color: var(--accent); }
.plan ~ .panel-head { margin-top: 20px; }
.filelist { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.panel-log { position: sticky; top: calc(var(--sp) * 1.4); }
.log { font-family: var(--font-mono); font-size: 12px; line-height: 1.7; display: flex; flex-direction: column; gap: 2px; max-height: 420px; overflow-y: auto; }
.log-line { color: var(--muted); white-space: pre-wrap; }
.log-hitl { color: var(--warn); }
.log-warn { color: var(--danger); }
.log-cursor { color: var(--ok); }
@media (prefers-reduced-motion: no-preference) {
  .log-cursor { animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
}

/* ---------- map ---------- */
.map { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: calc(var(--sp) * 1.6) calc(var(--sp) * 2) 60px; }
.map-head h2 { font-size: 20px; font-weight: 600; }
.map-head p { font-size: 13px; color: var(--muted); margin: 6px 0 calc(var(--sp) * 1.4); }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--sp); }
.area {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: var(--card-pad); display: flex; flex-direction: column; gap: 10px;
}
.area-idle { opacity: 0.55; }
.area-conflict { border-color: color-mix(in oklch, var(--danger), transparent 40%); }
.area-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.area-name { font-size: 13px; font-weight: 600; color: var(--text); }
.area-files { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
.area-warn {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
  color: var(--danger); background: color-mix(in oklch, var(--danger), transparent 92%);
  border-radius: 5px; padding: 6px 10px;
}
.area-free { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
.area-agent {
  display: flex; align-items: center; gap: 9px; text-align: left;
  background: var(--raised); border: 1px solid var(--line-soft); border-radius: 7px;
  padding: 8px 11px; cursor: pointer; color: var(--text); font-family: var(--font-ui); font-size: 12px;
}
.area-agent:hover { border-color: var(--faint); }
.area-agent-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.area-agent-state { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
